# 仅将 tools/ 目录发布到 GitHub Pages，站点根路径即 tools 内容（如 /emoj/）
name: Deploy tools to Pages

on:
  push:
    branches: [main]
    paths:
      - 'tools/**'
      - '.github/workflows/deploy-tools-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-tools
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: tools
      - id: deployment
        uses: actions/deploy-pages@v4
