# 仅将 tools/ 目录发布到 GitHub Pages，站点根路径即 tools 内容（如 /emoj/）
# 约定：静态工具直接复制子目录；含 package.json 且带 build 脚本的先构建，仅发布 dist/
name: Deploy tools to Pages

on:
  push:
    branches: [main]
    paths:
      - 'tools/**'
      - '!tools/esnote/**'
      - 'skills/**'
      - 'docs/note.md'
      - 'docs/images/**'
      - '.github/workflows/deploy-tools-pages.yml'
  workflow_dispatch:

concurrency:
  group: pages-tools
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact_id }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/**/package-lock.json

      - name: 构建需编译的 tools
        run: |
          set -euo pipefail
          shopt -s nullglob
          for dir in tools/*/; do
            pkg="${dir}package.json"
            [ -f "$pkg" ] || continue
            grep -q '"build"' "$pkg" || continue
            echo "构建 $(basename "$dir")..."
            (cd "$dir" && npm ci && npm run build)
          done

      - name: 组装发布目录
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p _publish

          for item in tools/*; do
            name=$(basename "$item")
            [ "$name" = "esnote" ] && continue
            if [ -f "$item" ]; then
              cp "$item" _publish/
            elif [ -d "$item" ]; then
              if [ -f "$item/package.json" ] && grep -q '"build"' "$item/package.json"; then
                [ -d "$item/dist" ] || { echo "构建产物缺失: $name/dist"; exit 1; }
                mkdir -p "_publish/$name"
                rsync -a "$item/dist/" "_publish/$name/dist/"
              else
                cp -r "$item" _publish/
              fi
            fi
          done

      - id: upload
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _publish

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 等待本次发布产物可查询
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.build.outputs.artifact-id }}
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_ID" =~ ^[0-9]+$ ]] || { echo '未获得发布产物 ID'; exit 1; }
          expected=$(printf '%s\tgithub-pages\tfalse' "$GITHUB_RUN_ID")
          for attempt in {1..8}; do
            if metadata=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" \
              --jq '[.workflow_run.id, .name, .expired] | @tsv') && [[ "$metadata" == "$expected" ]]; then
              echo "发布产物 $ARTIFACT_ID 已可查询"
              exit 0
            fi
            echo "发布产物 $ARTIFACT_ID 暂不可用（$attempt/8）"
            if (( attempt < 8 )); then sleep 3; fi
          done
          echo '发布产物未就绪，停止部署'
          exit 1

      - id: deployment
        uses: actions/deploy-pages@v5.0.1
