<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EMOJ 大全</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
.light{--bg:#f5f7fa;--bg-secondary:#ffffff;--bg-tertiary:#f0f2f5;--text:#1a1a2e;--text-secondary:#6c757d;--accent:#084298;--border:#dee2e6;--item-bg:#ffffff;--item-hover:#e9ecef;--shadow:rgba(0,0,0,0.08);--tooltip-bg:#343a40;--h1-color:#084298}
.dark{--bg:#1a1a1a;--bg-secondary:#252525;--bg-tertiary:#2d2d2d;--text:#e0e0e0;--text-secondary:#888;--accent:#0a84ff;--border:#3a3a3a;--item-bg:#2a2a2a;--item-hover:#3a3a3a;--shadow:rgba(0,0,0,0.5);--tooltip-bg:#4a4a4a;--h1-color:#fff}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
header{position:sticky;top:0;z-index:100;background:var(--bg-secondary);border-bottom:1px solid var(--border);padding:20px 24px;box-shadow:0 2px 8px var(--shadow);text-align:center}
header h1{font-size:1.5rem;font-weight:600;margin-bottom:16px;color:var(--h1-color)}
#theme-toggle{position:absolute;top:16px;right:20px;background:var(--bg-tertiary);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:8px 12px;cursor:pointer;font-size:1.1rem;transition:all .15s}
#theme-toggle:hover{background:var(--item-hover)}
#theme-toggle img{display:block;width:20px;height:20px}
.dark #theme-toggle img{filter:invert(1)}
#search-bar{width:100%;max-width:900px;padding:14px 19px;border:1px solid var(--border);border-radius:8px;background:var(--bg-tertiary);color:var(--text);font-size:19px;outline:none;transition:all .15s;margin:0 auto;display:block}
#search-bar:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(8,66,152,0.15)}
.dark #search-bar:focus{box-shadow:0 0 0 3px rgba(10,132,255,0.25)}
#stats{font-size:.85rem;color:var(--text-secondary);margin-top:10px;text-align:center}
#categories{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;justify-content:center}
.cat-btn{padding:6px 14px;border:1px solid var(--border);border-radius:16px;background:transparent;color:var(--text-secondary);font-size:.85rem;cursor:pointer;transition:all .15s;white-space:nowrap}
.cat-btn:hover{background:var(--bg-tertiary);color:var(--text)}
.cat-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}
.category-section{padding:16px 24px}
.category-title{font-size:.85rem;text-transform:uppercase;letter-spacing:.08em;color:var(--text-secondary);margin-bottom:12px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.emoji-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:4px}
.emoji-item{display:flex;flex-direction:column;align-items:center;justify-content:center;aspect-ratio:1;background:var(--item-bg);border-radius:4px;cursor:pointer;transition:all .15s;position:relative;border:1px solid var(--border);color:var(--text);padding:4px;box-shadow:0 2px 4px var(--shadow);outline:none;-webkit-tap-highlight-color:transparent;-webkit-appearance:none;-moz-appearance:none;appearance:none;user-select:none;-webkit-user-select:none}
.emoji-item:focus,.emoji-item:focus-visible,.emoji-item:active{outline:none;box-shadow:0 2px 4px var(--shadow)}
.emoji-item:hover{background:var(--item-hover);transform:scale(1.12);z-index:2;box-shadow:0 4px 16px var(--shadow)}
.emoji-char{font-size:32px;line-height:1;user-select:none;-webkit-user-select:none}
.emoji-item .tooltip{display:none;position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);background:var(--tooltip-bg);color:#fff;font-size:.7rem;padding:6px 10px;border-radius:6px;white-space:nowrap;z-index:10;pointer-events:none;box-shadow:0 2px 8px var(--shadow)}
.emoji-item .tooltip::after{content:'';position:absolute;top:100%;left:50%;transform:translateX(-50%);border:5px solid transparent;border-top-color:var(--tooltip-bg)}
.emoji-item:hover .tooltip{display:block}
.copy-toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--accent);color:#fff;padding:12px 28px;border-radius:10px;font-size:.95rem;z-index:200;opacity:0;transition:all .3s ease;pointer-events:none;box-shadow:0 4px 12px var(--shadow)}
.copy-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.no-results{text-align:center;padding:48px;color:var(--text-secondary);font-size:1rem}
</style>
</head>
<body>
<header>
<button id="theme-toggle" title="切换明暗主题"><img id="theme-toggle-icon" src="icons/mode_dark.png" alt="切换明暗主题"></button>
<h1>EMOJ 大全</h1>
<input type="text" id="search-bar" placeholder="搜索 emoji 名称、标签或直接粘贴 emoji...">

<div id="categories"></div>
</header>
<main id="main"></main>

<script>
(function(){
  var html=document.documentElement;
  var btn=document.getElementById("theme-toggle");
  var icon=document.getElementById("theme-toggle-icon");
  var saved=localStorage.getItem("emoji-theme")||"dark";
  html.classList.add(saved);
  function updateThemeIcon(isDark){
    icon.src=isDark?"icons/mode_light.png":"icons/mode_dark.png";
  }
  updateThemeIcon(saved==="dark");
  btn.addEventListener("click",function(){
    var isDark=html.classList.toggle("dark");
    html.classList.toggle("light",!isDark);
    updateThemeIcon(isDark);
    localStorage.setItem("emoji-theme",isDark?"dark":"light");
  });
})();

const allEmoji=EMOJI_DATA.map(e=>({name:e.n,char:e.c,unicode:e.u,category:e.cat,tags:e.t,description:e.d}));
const categoryOrder=['smileys','animals','people','food','objects','activities','symbols','places','flags','component'];
const categoryLabels={component:"组件",smileys:"表情",people:"人物",animals:"动物",food:"食物",places:"地点",activities:"活动",objects:"物品",symbols:"符号",flags:"国旗"};
let activeCategory="all",searchQuery="";

function getFiltered(){
  let list=allEmoji;
  if(activeCategory!=="all")list=list.filter(e=>e.category===activeCategory);
  if(searchQuery){const q=searchQuery.toLowerCase();list=list.filter(e=>e.name.toLowerCase().includes(q)||e.description.toLowerCase().includes(q)||e.unicode.toLowerCase().includes(q)||e.tags.some(t=>t.includes(q))||e.char.includes(q))}
  return list;
}

function renderCategories(){
  const cats={};for(const e of allEmoji)cats[e.category]=(cats[e.category]||0)+1;
  const c=document.getElementById("categories");
  let h='<button class="cat-btn '+(activeCategory==="all"?"active":"")+'" data-cat="all">全部 ('+allEmoji.length+')</button>';
  for(const cat of categoryOrder){
    const count=cats[cat];if(!count)continue;
    const label=categoryLabels[cat]||cat;
    h+='<button class="cat-btn '+(activeCategory===cat?"active":"")+'" data-cat="'+cat+'">'+label+' ('+count+')</button>';
  }
  c.innerHTML=h;
  c.querySelectorAll(".cat-btn").forEach(btn=>{btn.addEventListener("click",()=>{activeCategory=btn.dataset.cat;renderCategories();render()})});
}

function render(){
  const filtered=getFiltered();
  const main=document.getElementById("main");
  document.getElementById("stats").textContent="";
  if(filtered.length===0){main.innerHTML='<div class="no-results">未找到 emoji</div>';return}
  let h="";
  if(activeCategory!=="all"||!searchQuery){
    const groups={};for(const e of filtered){if(!groups[e.category])groups[e.category]=[];groups[e.category].push(e)}
    for(const[cat,items]of Object.entries(groups).sort((a,b)=>categoryOrder.indexOf(a[0])-categoryOrder.indexOf(b[0]))){
      const label=categoryLabels[cat]||cat;
      h+='<section class="category-section"><div class="category-title">'+label+'</div><div class="emoji-grid">';
      for(const e of items)h+='<button type="button" class="emoji-item" data-char="'+e.char+'" data-name="'+e.name+'"><span class="emoji-char">'+e.char+'</span><span class="tooltip">'+e.name+'<br><small style="opacity:0.6">'+e.unicode+'</small></span></button>';
      h+='</div></section>';
    }
  }else{
    h='<section class="category-section"><div class="category-title">搜索结果</div><div class="emoji-grid">';
    for(const e of filtered)h+='<button type="button" class="emoji-item" data-char="'+e.char+'" data-name="'+e.name+'"><span class="emoji-char">'+e.char+'</span><span class="tooltip">'+e.name+'<br><small style="opacity:0.6">'+e.unicode+'</small></span></button>';
    h+='</div></section>';
  }
  main.innerHTML=h;
  main.querySelectorAll(".emoji-item").forEach(item=>{
    item.addEventListener("pointerdown",e=>e.preventDefault());
    item.addEventListener("click",e=>{e.preventDefault();copyEmoji(item.dataset.char,item.dataset.name)});
  });
}

function copyEmoji(char,name){
  const done=()=>{const t=document.getElementById("toast");t.textContent="已复制 "+char+" "+name;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1500)};
  if(navigator.clipboard&&window.isSecureContext){
    navigator.clipboard.writeText(char).then(done).catch(()=>fallbackCopy(char,done));
  }else{
    fallbackCopy(char,done);
  }
}

function fallbackCopy(text,done){
  const input=document.createElement("textarea");
  input.value=text;
  input.setAttribute("readonly","");
  input.style.position="fixed";
  input.style.left="-9999px";
  document.body.appendChild(input);
  input.select();
  document.execCommand("copy");
  document.body.removeChild(input);
  done();
}

document.getElementById("search-bar").addEventListener("input",e=>{searchQuery=e.target.value.trim();render()});
renderCategories();render();
