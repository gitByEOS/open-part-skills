<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cross-Origin-Embedder-Policy" content="require-corp" />
    <meta http-equiv="Cross-Origin-Opener-Policy" content="same-origin" />
    <title>videoya.web</title>
    <style>
      :root {
        --bg: #0d1117;
        --panel: #161b22;
        --panel-2: #1c2230;
        --border: #2a3140;
        --text: #e6edf3;
        --muted: #8b949e;
        --accent: #4e7af3;
        --accent-2: #6d8df6;
        --danger: #f87171;
        --ok: #4ade80;
        --warn: #f59e0b;
        --radius: 14px;
        --radius-sm: 9px;
        --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      }

      *, *::before, *::after { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        background: radial-gradient(circle at 50% -20%, #142b3b 0, var(--bg) 28rem);
        color: var(--text);
        font-family: var(--sans);
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }

      button, input, select { font: inherit; }

      .page-shell {
        max-width: 860px;
        margin: 0 auto;
        padding: 32px 24px 48px;
      }

      .app-header { text-align: center; margin-bottom: 32px; }
      .app-header h1 { margin: 0; font-size: 32px; letter-spacing: -.02em; }
      .app-header h1 .brand-dot { color: var(--accent); }
      .app-header .subtitle { margin: 9px 0 0; color: var(--muted); font-size: 14px; }

      .warning-bar {
        display: none;
        gap: 9px;
        align-items: flex-start;
        margin-bottom: 18px;
        padding: 11px 14px;
        border: 1px solid rgba(245, 158, 11, .18);
        border-radius: var(--radius-sm);
        background: rgba(245, 158, 11, .045);
        color: #c8bd99;
        font-size: 13px;
      }
      .warning-bar::before { content: "⚠"; color: #c29a54; }

      .control-panel {
        margin-bottom: 18px;
        padding: 18px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: rgba(22, 27, 34, .82);
      }
      .control-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 14px;
      }
      .field { position: relative; display: flex; min-width: 0; flex-direction: column; gap: 8px; }
      .field span {
        color: var(--muted);
        font-size: 12px;
        font-weight: 650;
        letter-spacing: .08em;
      }
      .field::after {
        position: absolute;
        right: 20px;
        bottom: 18px;
        width: 7px;
        height: 7px;
        border-right: 1.5px solid #9bb6f6;
        border-bottom: 1.5px solid #9bb6f6;
        content: "";
        pointer-events: none;
        transform: rotate(45deg);
      }
      .field select {
        width: 100%;
        min-height: 40px;
        padding: 8px 48px 8px 11px;
        appearance: none;
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        outline: none;
        background: #10151d;
        color: var(--text);
        font-size: 13px;
        transition: border-color .16s ease, box-shadow .16s ease;
      }
      .field select:hover, .field select:focus { border-color: var(--accent); }
      .field select:focus { box-shadow: 0 0 0 3px rgba(78, 122, 243, .14); }

      .drop-zone {
        position: relative;
        display: flex;
        min-height: 218px;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 28px;
        border: 1.5px dashed var(--border);
        border-radius: var(--radius);
        background: rgba(22, 27, 34, .72);
        cursor: pointer;
        text-align: center;
        transition: border-color .18s ease, background .18s ease, transform .18s ease;
      }
      .drop-zone::before {
        display: grid;
        width: 44px;
        height: 44px;
        place-items: center;
        margin-bottom: 12px;
        border-radius: 14px;
        background: rgba(78, 122, 243, .16);
        color: #8eacff;
        content: "↑";
        font-size: 25px;
        font-weight: 750;
      }
      .drop-zone:hover, .drop-zone.drag-over, .drop-zone:focus-visible {
        outline: 0;
        border-color: var(--accent);
        background: rgba(45, 212, 191, .08);
      }
      .drop-zone.drag-over { transform: scale(1.01); }
      .drop-zone strong { font-size: 17px; }
      .drop-zone span { margin-top: 5px; color: var(--muted); font-size: 13px; }
      .drop-zone input[type="file"] { position: absolute; inset: 0; width: 100%; height: 100%; cursor: pointer; opacity: 0; }

      .file-list {
        display: flex;
        flex-direction: column;
        margin-top: 18px;
        overflow: hidden;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--panel);
      }
      .file-list:empty { display: none; }

      .file-card {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 10px 12px;
        align-items: center;
        padding: 13px 15px;
        background: transparent;
      }
      .file-card + .file-card { border-top: 1px solid var(--border); }
      .file-card.card-running { background: rgba(45, 212, 191, .055); }
      .file-card .file-info { display: flex; min-width: 0; flex-direction: column; gap: 4px; }
      .file-card .file-name { overflow: hidden; font-size: 14px; font-weight: 600; text-overflow: ellipsis; white-space: nowrap; }
      .file-card .file-meta { display: flex; flex-wrap: wrap; gap: 7px 11px; color: var(--muted); font-size: 12px; }
      .file-card .file-meta .size-before { text-decoration: line-through; }
      .file-card .file-meta .size-after { color: var(--ok); font-weight: 650; }
      .file-card .file-meta .savings { color: var(--accent); font-weight: 650; }
      .file-card .file-actions { display: flex; flex-shrink: 0; align-items: center; gap: 8px; }

      .file-card .progress-wrap {
        grid-column: 1 / -1;
        height: 6px;
        overflow: hidden;
        border-radius: 99px;
        background: #0c1118;
      }
      .file-card .progress-bar {
        width: 0;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, var(--accent), var(--accent-2));
        transition: width .25s ease;
      }
      @keyframes progress-stripe { from { background-position: 18px 0; } to { background-position: 0 0; } }
      .file-card .progress-bar.striped {
        background-image: linear-gradient(-45deg, rgba(255,255,255,.26) 25%, transparent 25%, transparent 50%, rgba(255,255,255,.26) 50%, rgba(255,255,255,.26) 75%, transparent 75%, transparent);
        background-size: 18px 18px;
        animation: progress-stripe .45s linear infinite;
      }

      .btn {
        min-height: 36px;
        padding: 7px 13px;
        border: 1px solid transparent;
        border-radius: var(--radius-sm);
        cursor: pointer;
        font-size: 13px;
        font-weight: 700;
        text-decoration: none;
        transition: opacity .16s ease, border-color .16s ease, color .16s ease;
        white-space: nowrap;
      }
      .btn:hover:not(:disabled) { opacity: .86; }
      .btn:disabled { cursor: not-allowed; opacity: .42; }
      .btn-primary { background: var(--accent); color: #06231f; }
      .btn-success { background: var(--accent-2); color: #071d2b; }
      .btn-outline { border-color: var(--border); background: transparent; color: var(--text); }
      .btn-outline:hover { border-color: var(--accent); color: var(--accent); }
      .btn-remove { border-color: var(--border); background: transparent; color: var(--muted); }
      .btn-remove:hover { border-color: var(--danger); color: var(--danger); }
      .btn-remove:disabled { pointer-events: none; }
      .btn-sm { min-height: 30px; padding: 5px 10px; font-size: 12px; font-weight: 650; }

      .actions-bar {
        display: flex;
        align-items: center;
        gap: 9px;
        margin-top: 14px;
        padding: 14px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--panel);
      }
      .actions-bar .count { margin-left: auto; color: var(--muted); font-size: 13px; }

      .status-badge {
        display: inline-block;
        padding: 3px 8px;
        border: 1px solid var(--border);
        border-radius: 99px;
        font-size: 11px;
        font-weight: 650;
      }
      .status-running { color: var(--accent-2); }
      .status-done { color: var(--ok); }
      .status-error { color: var(--danger); }
      .status-pending { color: var(--muted); }

      @media (max-width: 720px) {
        .page-shell { padding: 20px 16px 40px; }
        .control-grid { grid-template-columns: 1fr; }
      }
      @media (max-width: 520px) {
        .file-card { grid-template-columns: 1fr; }
        .file-card .file-actions { justify-content: flex-end; }
        .actions-bar { flex-wrap: wrap; }
        .actions-bar .count { width: 100%; margin-left: 0; }
        .actions-bar .btn { flex: 1; }
      }
    </style>
  </head>
  <body>
    <main class="page-shell">
      <header class="app-header">
        <h1>videoya<span class="brand-dot">.</span>web</h1>
        <p class="subtitle">在本机浏览器压缩视频，不会上传你的文件</p>
      </header>

      <div id="warning-bar" class="warning-bar">
        当前环境未启用多线程隔离，已自动切换为单线程压缩。
        如需更快速度，请使用 HTTPS 或 localhost。
      </div>

      <section class="control-panel">
        <div class="control-grid">
          <label class="field" for="quality">
            <span>压缩质量</span>
            <select id="quality">
              <option value="1">网络 (CRF 26)</option>
              <option value="2" selected>平衡 (CRF 23)</option>
              <option value="3">高质 (CRF 20)</option>
              <option value="4">无损 (CRF 18)</option>
            </select>
          </label>
          <label class="field" for="resolution">
            <span>分辨率</span>
            <select id="resolution">
              <option value="480">480p</option>
              <option value="720">720p</option>
              <option value="1080" selected>1080p</option>
              <option value="0">原始</option>
            </select>
          </label>
          <label class="field" for="format">
            <span>输出格式</span>
            <select id="format">
              <option value="mp4" selected>MP4 (H.264)</option>
              <option value="webm">WebM (VP8)</option>
            </select>
          </label>
        </div>
      </section>

      <div id="drop-zone" class="drop-zone" role="button" tabindex="0"
           aria-label="拖拽视频文件到这里或点击选择">
        <strong>选择或拖拽视频文件</strong>
        <span>支持 MP4、MOV、AVI、MKV、WebM 等格式；全部在本机处理</span>
        <input id="file-input" type="file" accept="video/*,.mp4,.mov,.avi,.mkv,.webm,.flv,.wmv" multiple />
      </div>

      <div id="file-list" class="file-list"></div>

      <div id="actions-bar" class="actions-bar" style="display:none;">
        <button id="compress-all" class="btn btn-primary" type="button">开始压缩</button>
        <button id="download-all" class="btn btn-success" type="button" style="display:none;">全部下载</button>
        <span id="file-count" class="count"></span>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/umd/ffmpeg.min.js"></script>
    <script>
    (() => {
      'use strict';

      // --- Worker cross-origin fix ---
      // COOP/COEP blocks cross-origin Workers. We intercept the constructor
      // and replace cross-origin URLs with a same-origin Blob URL that
      // imports the remote script via importScripts (which uses CORS, not COOP).
      {
        const OrigWorker = window.Worker;
        window.Worker = function(url, options) {
          const href = url?.href || String(url || '');
          const isCrossOrigin = href.startsWith('http') && !href.startsWith(location.origin);
          if (isCrossOrigin) {
            const blob = new Blob(
              [`importScripts("${href}");`],
              { type: 'application/javascript' }
            );
            url = URL.createObjectURL(blob);
          }
          return new OrigWorker(url, options);
        };
        window.Worker.prototype = OrigWorker.prototype;
      }

      const { FFmpeg } = FFmpegWASM;

      // --- COEP check ---
      // core-mt 在大文件转码时会产生 48B 假输出，固定使用单线程 core。
      const canUseMultiThread = false;
      if (!canUseMultiThread) {
        document.getElementById('warning-bar').style.display = 'block';
      }

      // --- State ---
      const files = []; // { id, file, name, size, status, resultBlob, outputExt, error, progress }
      let compressing = false;
      let idCounter = 0;
      const blobURLCache = new Map();
      const MAX_FFMPEG_THREADS = 3;
      const MAX_PARALLEL_FILES = 3;
      const ffmpegThreadCount = canUseMultiThread ? MAX_FFMPEG_THREADS : 1;
      const parallelFileCount = canUseMultiThread ? MAX_PARALLEL_FILES : 1;

      const $dropZone = document.getElementById('drop-zone');
      const $fileInput = document.getElementById('file-input');
      const $fileList = document.getElementById('file-list');
      const $actionsBar = document.getElementById('actions-bar');
      const $compressAll = document.getElementById('compress-all');
      const $downloadAll = document.getElementById('download-all');
      const $fileCount = document.getElementById('file-count');

      // --- Init FFmpeg ---
      async function toBlobURL(url, mimeType) {
        if (blobURLCache.has(url)) return blobURLCache.get(url);
        const response = await fetch(url);
        if (!response.ok) throw new Error(`资源加载失败: ${url}`);
        let blob = await response.blob();
        if (url.endsWith('/ffmpeg-core.js')) {
          // 上游 core 会对空值调用 startsWith，先在本地 Blob 中修正。
          const patched = (await blob.text())
            .replace(
              'function printErr(message){if(!message.startsWith(',
              'function printErr(message){message=String(message||"");if(!message.startsWith('
            )
            .replace(
              'catch(e){if(!e.message.startsWith("Aborted")){throw e}}',
              'catch(e){var message=String(e&&e.message||e||"");if(!message.startsWith("Aborted")){throw e}}'
            )
            .replace(
              'function isDataURI(filename){return filename.startsWith(dataURIPrefix)}',
              'function isDataURI(filename){filename=String(filename||"");return filename.startsWith(dataURIPrefix)}'
            )
            .replace(
              'function isFileURI(filename){return filename.startsWith("file://")}',
              'function isFileURI(filename){filename=String(filename||"");return filename.startsWith("file://")}'
            );
          blob = new Blob([patched], { type: mimeType });
        }
        const blobURL = URL.createObjectURL(new Blob([blob], { type: mimeType }));
        blobURLCache.set(url, blobURL);
        return blobURL;
      }

      async function createFFmpeg() {
        const ffmpeg = new FFmpeg();
        const packageName = canUseMultiThread ? 'core-mt' : 'core';
        const baseURL = `https://cdn.jsdelivr.net/npm/@ffmpeg/${packageName}@0.12.6/dist/umd`;
        const options = {
          coreURL: await toBlobURL(`${baseURL}/ffmpeg-core.js`, 'text/javascript'),
          wasmURL: await toBlobURL(`${baseURL}/ffmpeg-core.wasm`, 'application/wasm'),
        };
        if (canUseMultiThread) {
          options.workerURL = await toBlobURL(`${baseURL}/ffmpeg-core.worker.js`, 'text/javascript');
        }
        await ffmpeg.load(options);
        return ffmpeg;
      }

      // --- Parse FFmpeg log for frame progress ---
      function parseFrameTime(line) {
        const m = line.match(/frame=\s*(\d+)/);
        if (!m) return null;
        return parseInt(m[1]);
      }

      // --- File handling ---
      function addFiles(fileList) {
        for (const f of fileList) {
          if (!f.type.startsWith('video/') && !/\.(mp4|mov|avi|mkv|webm|flv|wmv)$/i.test(f.name)) continue;
          const id = ++idCounter;
          files.push({ id, file: f, name: f.name, size: f.size, status: 'pending', resultBlob: null, outputExt: null, error: null, progress: 0, totalFrames: 0 });
        }
        renderList();
      }

      function removeFile(id) {
        if (compressing) return;
        const idx = files.findIndex(f => f.id === id);
        if (idx !== -1) files.splice(idx, 1);
        renderList();
      }

      // --- Drop zone ---
      let dragDepth = 0;
      function isFileDrag(e) {
        return Array.from(e.dataTransfer?.types || []).includes('Files');
      }
      function setPageDragOver(active) {
        $dropZone.classList.toggle('drag-over', active);
      }
      document.addEventListener('dragenter', e => {
        if (!isFileDrag(e)) return;
        e.preventDefault();
        dragDepth++;
        setPageDragOver(true);
      });
      document.addEventListener('dragover', e => {
        if (!isFileDrag(e)) return;
        e.preventDefault();
        e.dataTransfer.dropEffect = 'copy';
      });
      document.addEventListener('dragleave', e => {
        if (!isFileDrag(e)) return;
        dragDepth = Math.max(0, dragDepth - 1);
        if (dragDepth === 0) setPageDragOver(false);
      });
      document.addEventListener('drop', e => {
        if (!isFileDrag(e)) return;
        e.preventDefault();
        dragDepth = 0;
        setPageDragOver(false);
        addFiles(e.dataTransfer.files);
      });
      $fileInput.addEventListener('change', () => {
        addFiles($fileInput.files);
        $fileInput.value = '';
      });

      // --- Render ---
      function formatSize(bytes) {
        if (bytes < 1024) return bytes + ' B';
        if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
        return (bytes / 1048576).toFixed(1) + ' MB';
      }

      function renderList() {
        if (files.length === 0) {
          $fileList.innerHTML = '';
          $actionsBar.style.display = 'none';
          return;
        }

        $actionsBar.style.display = 'flex';
        const doneCount = files.filter(f => f.status === 'done').length;
        $fileCount.textContent = `${doneCount} / ${files.length} 完成`;

        const allDone = doneCount === files.length && files.length > 0;
        if (allDone) {
          $downloadAll.style.display = 'inline-block';
          $compressAll.textContent = '清空列表';
          $compressAll.className = 'btn btn-outline';
          $compressAll.disabled = false;
        } else {
          $downloadAll.style.display = 'none';
          $compressAll.textContent = compressing ? '压缩中...' : '开始压缩';
          $compressAll.className = compressing ? 'btn btn-primary' : 'btn btn-primary';
        }

        $compressAll.disabled = compressing;

        $fileList.innerHTML = files.map(f => {
          const isRunning = f.status === 'running';
          const statusClass = `status-${f.status}`;
          const statusText = { pending: '等待中', running: '压缩中', done: '已完成', error: '失败' }[f.status];
          let metaHtml = '';
          if (f.status === 'done' && f.resultBlob) {
            const afterSize = f.resultBlob.size;
            const savings = ((1 - afterSize / f.size) * 100).toFixed(1);
            metaHtml = `
              <span class="size-before">${formatSize(f.size)}</span>
              <span>&rarr;</span>
              <span class="size-after">${formatSize(afterSize)}</span>
              <span class="savings">-${savings}%</span>`;
          } else if (isRunning) {
            metaHtml = `<span>${f.progress}%</span>`;
          } else {
            metaHtml = `<span>${formatSize(f.size)}</span>`;
          }

          let actionHtml = '';
          if (f.status === 'done' && f.resultBlob) {
            actionHtml = `<button class="btn btn-success btn-sm" onclick="window._dl(${f.id})">下载</button>`;
          } else if (f.status === 'error') {
            actionHtml = `<span style="color:#e74c3c;font-size:12px;">${f.error || '失败'}</span>`;
            actionHtml += `<button class="btn btn-remove btn-sm" onclick="window._rm(${f.id})">×</button>`;
          } else if (f.status === 'pending') {
            actionHtml = `<button class="btn btn-remove btn-sm" onclick="window._rm(${f.id})">×</button>`;
          }
          // running: no remove button

          return `
            <div class="file-card ${isRunning ? 'card-running' : ''}" id="card-${f.id}">
              <div class="file-info">
                <span class="file-name">${f.name}</span>
                <div class="file-meta">${metaHtml}</div>
              </div>
              <div class="file-actions">
                ${isRunning || f.status === 'error' ? `<span class="status-badge ${statusClass}">${statusText}</span>` : ''}
                ${actionHtml}
              </div>
              <div class="progress-wrap">
                <div class="progress-bar ${isRunning ? 'striped' : ''}" id="progress-${f.id}" style="width: ${isRunning && f.progress > 0 ? f.progress + '%' : isRunning ? '10%' : f.status === 'done' ? '100%' : '0%'}"></div>
              </div>
            </div>`;
        }).join('');
      }

      // --- Compress ---
      // Browser WASM is slower, use faster presets
      const CRF_MAP = { 1: 26, 2: 23, 3: 20, 4: 18 };
      const PRESET_MAP = { 1: 'ultrafast', 2: 'superfast', 3: 'veryfast', 4: 'faster' };

      // Update progress bar and meta text in-place (no full re-render)
      function updateProgress(id, percent) {
        const item = files.find(f => f.id === id);
        const bar = document.getElementById(`progress-${id}`);
        const meta = document.querySelector(`#card-${id} .file-meta`);
        if (item) item.progress = percent;
        if (bar) {
          bar.style.width = percent + '%';
          // Keep striped animation throughout compression
        }
        if (meta) meta.textContent = `${percent}%`;
      }

      function updateMetaText(id, text) {
        const meta = document.querySelector(`#card-${id} .file-meta`);
        if (meta) meta.textContent = text;
      }

      async function countVideoFrames(ff, inputName, itemId) {
        let totalFrames = 0;
        const probeHandler = ({ message }) => {
          const frame = parseFrameTime(message);
          if (frame && frame > totalFrames) {
            totalFrames = frame;
            updateMetaText(itemId, `统计帧数: ${totalFrames}`);
          }
        };

        ff.on('log', probeHandler);
        try {
          await ff.exec(['-i', inputName, '-map', '0:v:0', '-c:v', 'copy', '-an', '-f', 'null', '-']);
          return totalFrames;
        } finally {
          ff.off('log', probeHandler);
        }
      }

      function getDownloadName(item) {
        const ext = item.outputExt || 'mp4';
        const baseName = item.name.replace(/\.[^.]+$/, '');
        return `${baseName}_compressed.${ext}`;
      }

      async function compressFile(item) {
        const itemRef = files.find(f => f.id === item.id);
        if (!itemRef) return;

        itemRef.status = 'running';
        itemRef.progress = 0;
        renderList();

        let ff = null;
        let logHandler = null;

        try {
          ff = await createFFmpeg();
          const inputName = 'input' + item.id;
          const ext = document.getElementById('format').value;
          const outputName = `output_${item.id}.${ext}`;

          await ff.writeFile(inputName, new Uint8Array(await itemRef.file.arrayBuffer()));

          updateMetaText(item.id, '统计帧数...');
          const totalFrames = await countVideoFrames(ff, inputName, item.id);
          updateProgress(item.id, 0);
          window._debugLog && window._debugLog(`totalFrames=${totalFrames}`);

          // Step 2: compress, tracking frame progress
          const quality = document.getElementById('quality').value;
          const resolution = parseInt(document.getElementById('resolution').value);
          const crf = CRF_MAP[quality];
          const preset = PRESET_MAP[quality];

          let args = ['-threads', String(ffmpegThreadCount), '-i', inputName];

          if (resolution > 0) {
            args.push('-vf', `scale=-2:${resolution}:flags=lanczos`);
          }

          if (ext === 'webm') {
            args.push('-c:v', 'libvpx', '-deadline', 'good', '-cpu-used', '4',
                        '-crf', String(crf), '-b:v', '0',
                        '-pix_fmt', 'yuv420p', '-c:a', 'libopus');
          } else {
            args.push('-c:v', 'libx264', '-profile:v', 'main', '-crf', String(crf),
                        '-preset', preset, '-pix_fmt', 'yuv420p',
                        '-movflags', '+faststart', '-c:a', 'aac');
          }

          args.push('-y', outputName);

          // Track frame progress from FFmpeg log
          let prevFrame = 0;
          logHandler = ({ message }) => {
            const m = message.match(/frame=\s*(\d+)/);
            if (m) {
              const frame = parseInt(m[1]);
              if (frame > prevFrame) {
                prevFrame = frame;
                if (totalFrames > 0) {
                  const pct = Math.min(99, Math.floor((frame / totalFrames) * 100));
                  updateProgress(item.id, pct);
                }
              }
            }
          };
          ff.on('log', logHandler);

          await ff.exec(args);

          const data = await ff.readFile(outputName);
          const blob = new Blob([data.buffer], { type: `video/${ext === 'webm' ? 'webm' : 'mp4'}` });
          itemRef.resultBlob = blob;
          itemRef.outputExt = ext;
          itemRef.status = 'done';
          itemRef.progress = 100;

          await ff.deleteFile(inputName).catch(() => {});
          await ff.deleteFile(outputName).catch(() => {});
        } catch (err) {
          const errorMessage = err?.stack || err?.message || String(err);
          console.error('压缩失败:', errorMessage);
          itemRef.error = errorMessage.split('\n')[0];
          itemRef.status = 'error';
        } finally {
          if (ff && logHandler) ff.off('log', logHandler);
          if (ff) ff.terminate();
        }

        renderList();
      }

      async function runParallel(items, limit, task) {
        let nextIndex = 0;
        const workerCount = Math.min(limit, items.length);
        const workers = Array.from({ length: workerCount }, async () => {
          while (nextIndex < items.length) {
            const current = items[nextIndex++];
            await task(current);
          }
        });
        await Promise.all(workers);
      }

      $compressAll.addEventListener('click', async () => {
        // Check if we're in "clear list" mode (all done)
        const allDone = files.length > 0 && files.every(f => f.status === 'done');
        if (allDone) {
          files.length = 0;
          renderList();
          return;
        }

        const pending = files.filter(f => f.status === 'pending' || f.status === 'error');
        if (pending.length === 0) return;
        compressing = true;
        renderList();

        await runParallel(pending, parallelFileCount, compressFile);

        compressing = false;
        renderList();
      });

      $downloadAll.addEventListener('click', () => {
        const done = files.filter(f => f.status === 'done' && f.resultBlob);
        for (const f of done) {
          const url = URL.createObjectURL(f.resultBlob);
          const a = document.createElement('a');
          a.href = url;
          a.download = getDownloadName(f);
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
        }
      });

      // --- Global handlers for inline buttons ---
      window._dl = (id) => {
        const item = files.find(f => f.id === id);
        if (!item || !item.resultBlob) return;
        const url = URL.createObjectURL(item.resultBlob);
        const a = document.createElement('a');
        a.href = url;
        a.download = getDownloadName(item);
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      };

      window._rm = (id) => removeFile(id);
    })();
    </script>
  </body>
</html>
